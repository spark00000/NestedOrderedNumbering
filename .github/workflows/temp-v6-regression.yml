name: Temp v6 regression

on:
  push:
    branches:
      - fix/numbering-stability-after-indent-v6

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm release:check
      - name: Refresh main.js and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/temp-v6-regression.yml
          git add main.js .github/workflows/temp-v6-regression.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh main.js for v6 regression"
          git push
