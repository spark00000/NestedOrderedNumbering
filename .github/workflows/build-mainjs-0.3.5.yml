name: Build main.js 0.3.5

on:
  push:
    branches: [fix/0.3.5-fenced-code-runtime]

permissions:
  contents: read

jobs:
  build-mainjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: main-js-0.3.5
          path: main.js
          if-no-files-found: error
