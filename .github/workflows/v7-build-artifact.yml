name: V7 Build Artifact

on:
  push:
    branches:
      - fix/live-preview-hanging-indent-v7

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit refreshed main.js when required
        shell: bash
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js already matches production build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f main.js
          git commit -m "build: refresh v7 main.js"
          git push origin HEAD:fix/live-preview-hanging-indent-v7
      - uses: actions/upload-artifact@v4
        with:
          name: v7-main-js
          path: main.js
          if-no-files-found: error
