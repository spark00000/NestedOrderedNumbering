name: Temp Refresh main.js v3

on:
  push:
    branches:
      - fix/variable-prefix-hanging-indent-v3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/variable-prefix-hanging-indent-v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm release:check
      - name: Commit generated main.js and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-refresh-main-v3.yml
          git add main.js .github/workflows/temp-refresh-main-v3.yml
          git commit -m "build: refresh main.js for hanging indent v3"
          git push origin HEAD:fix/variable-prefix-hanging-indent-v3
