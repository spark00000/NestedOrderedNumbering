name: Temp Build Artifact

on:
  push:
    branches:
      - fix/variable-prefix-hanging-indent

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit generated main.js and remove temporary workflow
        run: |
          rm .github/workflows/temp-build-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/temp-build-artifact.yml
          git commit -m "build: refresh main.js for hanging indent fix"
          git push origin HEAD:fix/variable-prefix-hanging-indent
