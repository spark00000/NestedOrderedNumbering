name: Build v8 artifact

on:
  push:
    branches: [fix/live-preview-hanging-indent-v8]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: v8-main-js
          path: main.js
